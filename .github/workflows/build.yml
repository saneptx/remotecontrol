name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows-host:
    name: Windows 被控端
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p rc-protocol
      - run: cargo build --release -p rc-host -p rc-client
      - name: 确认不依赖 VC++ 运行库
        shell: pwsh
        run: |
          $dumpbin = Get-ChildItem "${env:ProgramFiles}\Microsoft Visual Studio" -Recurse -Filter dumpbin.exe -ErrorAction SilentlyContinue |
            Where-Object FullName -like '*Hostx64\x64*' | Select-Object -First 1
          $deps = & $dumpbin.FullName /dependents target\release\rc-host.exe | Out-String
          Write-Output $deps
          if ($deps -match 'VCRUNTIME|MSVCP|api-ms-win-crt') { throw "rc-host.exe 仍依赖 C 运行库" }
          $deps = & $dumpbin.FullName /dependents target\release\rc-client.exe | Out-String
          if ($deps -match 'VCRUNTIME|MSVCP|api-ms-win-crt') { throw "rc-client.exe 仍依赖 C 运行库" }
      # exe 与安装脚本放在同一目录（脚本按自身所在目录查找 rc-host.exe）
      - name: 打包
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/rc-host.exe, target/release/rc-client.exe, packaging/windows/*.cmd dist/
      - uses: actions/upload-artifact@v4
        with:
          name: rc-host-windows-x64
          path: dist/
          if-no-files-found: error

  macos-client:
    name: macOS 控制端
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: packaging/macos/make-app.sh
      # 打成 zip 以保留应用包结构与可执行权限
      - run: ditto -c -k --keepParent target/RemoteControl.app RemoteControl-macos-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: RemoteControl-macos-arm64
          path: RemoteControl-macos-arm64.zip
          if-no-files-found: error

  release:
    name: 发布 Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows-host, macos-client]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            rc-host.exe
            rc-client.exe
            install-service.cmd
            uninstall-service.cmd
            diagnose.cmd
            RemoteControl-macos-arm64.zip
          generate_release_notes: true
