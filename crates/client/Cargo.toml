[package]
name = "rc-client"
version.workspace = true
edition.workspace = true
description = "SuperControl 界面与控制端：发现设备、硬件解码显示远端画面、回传键鼠输入"

[dependencies]
anyhow.workspace = true
clap.workspace = true
socket2.workspace = true
rc-protocol.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
if-addrs = "0.15"
png = "0.17"
cpal = "0.18"

winit = "0.30"
eframe = { version = "0.37", default-features = false, features = ["accesskit", "default_fonts", "wgpu", "system_fonts"] }
tray-icon = { version = "0.26", default-features = false }

[build-dependencies]
embed-resource = "3"

[target.'cfg(target_os = "macos")'.dependencies]
rc-macos.workspace = true
objc2 = "0.6"
objc2-foundation = "0.3"

[target.'cfg(windows)'.dependencies]
rc-windows.workspace = true
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
